# Application
spring.application.name=global-safety-net-navigator
server.port=8080

# Logging
logging.level.com.safetywing.navigator=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator (optimized for faster startup)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS - Multiple origins supported (comma-separated)
cors.allowed-origins=http://localhost:3000,https://safetynetnavigator.vercel.app
